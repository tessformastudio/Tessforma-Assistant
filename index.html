<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tessforma Assistant — Tessforma Studio & Academy</title>
  <meta name="description" content="Tessforma Assistant - quick design & academy help. Graphic design, desktop publishing, website creation, video editing, content writing.">
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#6A0DAD">
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" aria-label="Sidebar">
      <div class="brand">
        <!-- Replace logo-placeholder.png with your logo files inside assets/logos/ -->
        <img src="assets/logos/logo-tessforma.png" alt="Tessforma Studio" id="brand-logo">
        <h1>Tessforma Assistant</h1>
        <p class="tagline">Transforming Ideas. Designing Impact.</p>
      </div>

      <nav class="nav">
        <button class="nav-btn" data-action="new-chat">+ New Conversation</button>
        <hr />
        <h3>Quick Actions</h3>
        <ul>
          <li><button class="nav-btn" data-intent="service_logo">Logo Design</button></li>
          <li><button class="nav-btn" data-intent="service_flyer">Flyer Design</button></li>
          <li><button class="nav-btn" data-intent="service_publishing">Book Formatting</button></li>
          <li><button class="nav-btn" data-intent="academy_enroll">Enroll (Tessforma Academy)</button></li>
          <li><button class="nav-btn" data-intent="pricing">Pricing Guide</button></li>
        </ul>
      </nav>

      <section class="payment-card" aria-label="Payments">
        <h4>Payments</h4>
        <p>Pay securely (card) or send bank transfer.</p>
        <div class="payment-actions">
          <button id="pay-card" class="pay-btn">Pay with Card</button>
          <button id="pay-bank" class="pay-btn">Bank Transfer (OPay)</button>
        </div>
      </section>

      <section class="lang-mode">
        <label for="lang-select">Language</label>
        <select id="lang-select">
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="ar">العربية</option>
          <option value="de">Deutsch</option>
        </select>

        <div class="mode-toggle">
          <label class="switch">
            <input type="checkbox" id="dark-toggle" />
            <span class="slider"></span>
          </label>
          <span>Dark Mode</span>
        </div>
      </section>

      <footer class="sidebar-footer">
        <small>© <span id="year"></span> Tessforma Studio</small>
        <button id="help-btn" class="nav-btn">Help & Contact</button>
      </footer>
    </aside>

    <main class="main">
      <header class="main-header">
        <div class="header-left">
          <h2 id="main-title">Tessforma Assistant</h2>
          <p id="main-sub">Ask about services, pricing or enroll in Tessforma Academy.</p>
        </div>
        <div class="header-right">
          <a href="mailto:tessformastudio@gmail.com" class="contact-link">📧 tessformastudio@gmail.com</a>
          <a href="https://wa.me/2349018341741" target="_blank" rel="noopener" class="contact-link">💬 +234 901 834 1741</a>
        </div>
      </header>

      <section class="chat-area" id="chat-area" aria-live="polite">
        <div id="chat-messages" class="chat-messages"></div>
      </section>

      <form id="chat-form" class="chat-form" autocomplete="off">
        <button type="button" id="voice-btn" title="Voice input">🎤</button>
        <input id="user-input" type="text" placeholder="Type your message or ask 'How much for a logo?'" aria-label="Message input" />
        <div class="inline-payments" id="inline-payments" aria-hidden="true">
          <button type="button" class="pay-inline" data-method="card">Card</button>
          <button type="button" class="pay-inline" data-method="bank">Bank transfer</button>
        </div>
        <button type="submit" id="send-btn">Send</button>
      </form>
    </main>
  </div>

  <script>
    // light inline bootstrap for year
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

  <script src="model.json" type="application/json" defer></script>
  <script src="translations.json" type="application/json" defer></script>
  <script src="app.js" defer></script>
</body>
  </html>
